name: PayGuard Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  APP_ENV: SANDBOX
  DATABASE_URL: sqlite:///${{ github.workspace }}/payguard_ci.db
  TEST_DATABASE_URL: sqlite:///${{ github.workspace }}/payguard_test_ci.db
  WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET || 'whsec_sandbox_ci_ephemeral_key' }}
  API_AUTH_TOKEN: ${{ secrets.API_AUTH_TOKEN || 'pg_sandbox_ci_token' }}
  VITE_API_BASE_URL: http://127.0.0.1:8000

jobs:
  backend-and-e2e-quality:
    name: Backend Pytest, Coverage & Playwright E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run database migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Execute Pytest suites with coverage & HTML report
        run: |
          mkdir -p reports
          pytest tests/api tests/payment tests/webhooks tests/database tests/integration \
            --cov=backend/app \
            --cov-report=term-missing \
            --cov-report=html:reports/coverage-html \
            --html=reports/pytest-report.html \
            --self-contained-html \
            --junitxml=reports/junit.xml \
            -v

      - name: Build frontend production bundle
        working-directory: frontend
        run: npm run build

      - name: Start backend & frontend servers for Playwright E2E
        run: |
          set -euo pipefail
          BACKEND_PID=""
          FRONTEND_PID=""
          cleanup() {
            [ -n "$BACKEND_PID" ] && kill "$BACKEND_PID" 2>/dev/null || true
            [ -n "$FRONTEND_PID" ] && kill "$FRONTEND_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          PYTHONPATH=backend uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          BACKEND_PID=$!
          BACKEND_OK=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "Backend is healthy"
              BACKEND_OK=1
              break
            fi
            sleep 1
          done
          if [ "$BACKEND_OK" -ne 1 ]; then
            echo "Backend failed to start"
            exit 1
          fi

          npm --prefix frontend run preview -- --host 127.0.0.1 --port 5173 --strictPort &
          FRONTEND_PID=$!
          FRONTEND_OK=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5173 > /dev/null; then
              echo "Frontend is ready"
              FRONTEND_OK=1
              break
            fi
            sleep 1
          done
          if [ "$FRONTEND_OK" -ne 1 ]; then
            echo "Frontend failed to start"
            exit 1
          fi

          NODE_PATH=frontend/node_modules npx --prefix frontend playwright test --config playwright.config.ts

      - name: Upload Pytest, Coverage & Playwright HTML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payguard-quality-reports
          path: |
            reports/pytest-report.html
            reports/junit.xml
            reports/coverage-html
            reports/playwright-report
          retention-days: 14
