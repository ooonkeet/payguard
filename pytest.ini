[pytest]
testpaths = tests
pythonpath = backend
addopts = -ra --strict-markers
asyncio_default_fixture_loop_scope = function
markers =
    smoke: Fast critical path smoke tests for PayGuard APIs
    regression: Core payment and platform regression test suite
    edge_case: Payment concurrency, timeout, state machine, and webhook edge cases
    contract: API response schema, status code, and error envelope contract tests
    database: Database persistence, uniqueness, decimal precision, and referential integrity tests
    integration: End-to-end multi-module backend workflow tests
